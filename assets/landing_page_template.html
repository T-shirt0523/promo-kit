<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} —— {{TAGLINE}}</title>
<meta name="description" content="{{SUBTITLE}}">
<style>
  /* 单文件、零外部依赖：拷到任何静态托管上都能直接跑。
     转化顺序是刻意排的：先给结果 → 再给证据 → 再给价格 → 最后处理顾虑。 */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1220; --bg2:#141c30; --fg:#eef3fb; --muted:#9aa9c2;
    --accent:#4dd0ff; --line:rgba(255,255,255,.10); --card:rgba(255,255,255,.05);
  }
  body{background:var(--bg);color:var(--fg);line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",
                "PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:0 24px}
  .hero{padding:96px 0 72px;background:
    radial-gradient(90% 70% at 20% 0%,rgba(77,208,255,.14) 0%,transparent 60%)}
  .kicker{display:inline-block;font-size:13px;letter-spacing:2px;color:var(--accent);
    border:1px solid rgba(77,208,255,.4);border-radius:999px;padding:6px 16px;
    margin-bottom:26px}
  h1{font-size:clamp(34px,5.4vw,58px);line-height:1.16;letter-spacing:1px;
    font-weight:800;margin-bottom:22px}
  .lead{font-size:clamp(16px,2.1vw,21px);color:var(--muted);max-width:660px}
  .hero-actions{margin-top:38px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-block;background:var(--accent);color:#06121d;font-weight:700;
    padding:15px 34px;border-radius:999px;text-decoration:none;
    transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(77,208,255,.28)}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);box-shadow:none}
  section{padding:62px 0;border-top:1px solid var(--line)}
  h2{font-size:clamp(22px,3vw,30px);font-weight:700;margin-bottom:30px;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:18px}
  .fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
  .fk{font-size:17px;font-weight:700;margin-bottom:10px}
  .fv{font-size:15px;color:var(--muted)}
  .shots{display:grid;gap:16px}
  .shot{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
  .muted{color:var(--muted);font-size:15px}
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;
    align-items:stretch}
  .tier{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:30px 26px;display:flex;flex-direction:column;gap:12px}
  .tier.hot{border-color:var(--accent);background:rgba(77,208,255,.07);
    box-shadow:0 0 0 1px rgba(77,208,255,.14)}
  .tn{font-size:16px;font-weight:700;letter-spacing:1px}
  .tp{font-size:42px;font-weight:800;line-height:1}
  .tp small{font-size:20px;font-weight:600;margin-right:2px}
  .ti{font-size:14px;color:var(--muted);flex:1}
  .tr{font-size:12px;color:var(--accent);letter-spacing:1px}
  details{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 22px;margin-bottom:12px}
  details[open]{border-color:rgba(77,208,255,.35)}
  summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"＋ ";color:var(--accent)}
  details[open] summary::before{content:"－ "}
  details p{color:var(--muted);font-size:15px;margin-top:12px}
  footer{padding:52px 0 76px;border-top:1px solid var(--line);color:var(--muted);
    font-size:14px}
  footer .row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .note{margin-top:18px;font-size:13px;color:#6f7d94;line-height:1.7}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="kicker">独立开发 · 自研</span>
    <h1>{{NAME}}</h1>
    <p class="lead">{{TAGLINE}}</p>
    <div class="hero-actions">
      <a class="btn" href="#price">看价格</a>
      <a class="btn ghost" href="#shots">看实机画面</a>
    </div>
  </div>
</header>

<section>
  <div class="wrap">
    <h2>它是什么</h2>
    <p class="lead">{{SUBTITLE}}</p>
  </div>
</section>

<section>
  <div class="wrap">
    <h2>核心特点</h2>
    <div class="grid">
{{FEATURES}}
    </div>
  </div>
</section>

<section id="shots">
  <div class="wrap">
    <h2>实机画面</h2>
    <div class="shots">
{{SHOTS}}
    </div>
  </div>
</section>

<section id="price">
  <div class="wrap">
    <h2>价格</h2>
    <div class="tiers">
{{PRICES}}
    </div>
    <p class="note">
      交付方式：{{DELIVERY}}。运行环境：{{PLATFORMS}}。
      虚拟内容一经交付不支持退款，下单前请先核对运行环境。
    </p>
  </div>
</section>

<section>
  <div class="wrap">
    <h2>常见问题</h2>
{{FAQ}}
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="row">
      <div>{{NAME}} · 由 {{SELLER}} 独立开发</div>
      <div>© {{YEAR}}</div>
    </div>
    <p class="note">
      本页所有描述均基于可核实的事实，不含销量、评价、奖项等未经证实的信息。<br>
      页面中的截图来自实际运行画面。
    </p>
  </div>
</footer>

</body>
</html>
