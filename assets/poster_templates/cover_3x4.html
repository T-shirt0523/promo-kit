<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>{{TITLE}} · 小红书封面</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:{{W}}px;height:{{H}}px;overflow:hidden}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
       -webkit-font-smoothing:antialiased}
  /* 高度全部走弹性，不写死 —— 文案行数一变，固定高度就会把内容挤出画布（已踩过）。 */
  .poster{position:relative;width:{{W}}px;height:{{H}}px;
    background:radial-gradient(120% 80% at 15% 0%,{{C_BG2}} 0%,{{C_BG1}} 55%,{{C_BG1}} 100%);
    color:{{C_FG}};display:flex;flex-direction:column;
    padding:80px 76px 76px;overflow:hidden}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
        right:-320px;top:-260px;
        background:radial-gradient(circle,{{C_ACCENT}}33 0%,transparent 68%);
        pointer-events:none}
  .badges{flex:0 0 auto;display:flex;gap:14px;flex-wrap:wrap}
  .badge{font-size:25px;line-height:1;padding:12px 24px;border-radius:999px;
         border:2px solid {{C_ACCENT}}66;color:{{C_ACCENT}};
         background:{{C_CARD}};letter-spacing:1px;white-space:nowrap}
  .main{flex:0 0 auto;margin-top:34px}
  .title{font-size:92px;font-weight:800;line-height:1.14;letter-spacing:2px;
         margin:0 0 24px;word-break:break-word}
  /* 行数钳制：字数估算永远会猜错（字体、标点宽度都影响换行），
     交给浏览器裁到最多两行，就不会出现「吊着半个字」的难看收尾。 */
  .tagline{font-size:41px;line-height:1.5;color:{{C_ACCENT}};font-weight:600;
           margin:0;display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden}
  /* 按截图自身的 16:9 定比例，不用 flex 撑高（撑高只会让 contain 留大片空白） */
  .shot-wrap{flex:0 1 auto;aspect-ratio:16/9;width:100%;min-height:0;
             margin:38px 0 0;border-radius:22px;
             overflow:hidden;border:2px solid {{C_CARD}};
             background:{{C_BG2}};
             box-shadow:0 24px 60px rgba(0,0,0,.35);display:{{SHOT_STYLE}}}
  /* 截图用 contain 不用 cover：cover 会把实机画面左右裁掉，
     连界面上的文字都会被切一半。宣传图宁可有留边，也不能把产品画面裁坏。 */
  .shot{width:100%;height:100%;object-fit:contain;display:block}
  ul{flex:0 0 auto;list-style:none;margin:34px 0 0;padding:0;
     display:flex;flex-direction:column;gap:16px}
  li{font-size:33px;line-height:1.4;padding-left:44px;position:relative}
  li::before{content:"";position:absolute;left:0;top:16px;width:20px;height:20px;
             border-radius:6px;background:{{C_ACCENT}}}
  .foot{flex:0 0 auto;margin-top:auto;display:flex;align-items:flex-end;
        justify-content:space-between;padding-top:38px}
  .price{font-size:28px;color:{{C_MUTED}};letter-spacing:1px}
  .price b{display:block;font-size:60px;color:{{C_FG}};letter-spacing:0;margin-top:6px}
  .cta{font-size:27px;color:{{C_ACCENT}};border:2px solid {{C_ACCENT}}88;
       border-radius:999px;padding:15px 32px;white-space:nowrap}
</style></head>
<body>
<div class="poster">
  <div class="glow"></div>
  <div class="badges">{{BADGES}}</div>
  <div class="main">
    <h1 class="title">{{TITLE}}</h1>
    <p class="tagline">{{TAGLINE}}</p>
  </div>
  <div class="shot-wrap"><img class="shot" src="{{SHOT}}" alt=""></div>
  <ul>{{BULLETS}}</ul>
  <div class="foot">
    <div class="price">标准版<b>{{PRICE}}</b></div>
    <div class="cta">{{CTA}}</div>
  </div>
</div>
</body></html>
