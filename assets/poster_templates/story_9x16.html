<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>{{TITLE}} · 竖屏故事</title>
<style>
  /* 三段式竖屏：钩子 → 卖点 → 行动号召。刷到的人 2 秒内要看完第一屏。 */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:{{W}}px;height:{{H}}px;overflow:hidden}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
       -webkit-font-smoothing:antialiased}
  .poster{position:relative;width:{{W}}px;height:{{H}}px;color:{{C_FG}};
    background:linear-gradient(178deg,{{C_BG2}} 0%,{{C_BG1}} 48%,{{C_BG1}} 100%);
    display:flex;flex-direction:column;padding:132px 80px 108px;overflow:hidden}
  .glow{position:absolute;width:1100px;height:1100px;border-radius:50%;
        left:-300px;bottom:-420px;
        background:radial-gradient(circle,{{C_ACCENT}}2e 0%,transparent 66%);
        pointer-events:none}
  .step1{flex:0 0 auto}
  .badges{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}
  .badge{font-size:24px;line-height:1;padding:12px 24px;border-radius:999px;
         border:2px solid {{C_ACCENT}}66;color:{{C_ACCENT}};background:{{C_CARD}};
         white-space:nowrap}
  .title{font-size:104px;font-weight:800;line-height:1.12;margin:0;letter-spacing:2px;
         word-break:break-word}
  /* 行数钳制：不靠字数估算，交给浏览器裁到最多两行 */
  .sub{font-size:38px;line-height:1.5;color:{{C_MUTED}};margin:30px 0 0;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
       overflow:hidden}
  /* 截图按 16:9 自然比例成一条带，不靠 flex 撑高 —— 撑高只会让 contain 留出大片空白 */
  .shot-wrap{flex:0 0 auto;aspect-ratio:16/9;margin:56px 0 0;border-radius:24px;
             overflow:hidden;border:2px solid {{C_CARD}};background:{{C_BG2}};
             box-shadow:0 30px 70px rgba(0,0,0,.4);display:{{SHOT_STYLE}}}
  /* contain 而非 cover：实机画面不能被裁 */
  .shot{width:100%;height:100%;object-fit:contain;display:block}
  .step2{flex:0 0 auto;margin-top:auto;display:flex;flex-direction:column;gap:26px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:26px;
     counter-reset:b}
  li{counter-increment:b;display:flex;align-items:center;gap:26px;
     background:{{C_CARD}};border-radius:20px;padding:30px 34px;font-size:37px;
     line-height:1.4}
  li::before{content:counter(b);flex:0 0 auto;width:62px;height:62px;border-radius:50%;
             background:{{C_ACCENT}};color:{{C_BG1}};font-size:33px;font-weight:800;
             display:flex;align-items:center;justify-content:center}
  .step3{flex:0 0 auto;margin-top:auto;display:flex;align-items:center;
         justify-content:space-between;gap:24px;padding-top:52px;
         border-top:2px solid {{C_CARD}}}
  .price{font-size:28px;color:{{C_MUTED}}}
  .price b{display:block;font-size:62px;color:{{C_FG}};margin-top:6px}
  .cta{font-size:30px;font-weight:700;background:{{C_ACCENT}};color:{{C_BG1}};
       border-radius:999px;padding:22px 42px;letter-spacing:2px;white-space:nowrap}
</style></head>
<body>
<div class="poster">
  <div class="glow"></div>
  <div class="step1">
    <div class="badges">{{BADGES}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
  </div>
  <div class="shot-wrap"><img class="shot" src="{{SHOT}}" alt=""></div>
  <div class="step2"><ul>{{BULLETS}}</ul></div>
  <div class="step3">
    <div class="price">标准版<b>{{PRICE}}</b></div>
    <div class="cta">{{CTA}}</div>
  </div>
</div>
</body></html>
